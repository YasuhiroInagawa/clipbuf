name: Release

# Builds the distributables for all three platforms and attaches them to a draft release
# (13.1, 13.2). The release is left as a draft so the assets can be checked before anyone
# can download them; publishing is a deliberate click.
#
# Secrets used:
#   TAURI_SIGNING_PRIVATE_KEY           REQUIRED. The minisign key that signs the update
#                                       artifacts (13.7). `createUpdaterArtifacts` is on, so
#                                       the bundler fails outright when the key is missing.
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its passphrase, empty string when it has none
# The Apple secrets are optional; without them the macOS build is unsigned and un-notarised,
# which is fine for a test tag but not for a real release (13.3):
#   APPLE_CERTIFICATE                   base64 of the Developer ID Application .p12
#   APPLE_CERTIFICATE_PASSWORD          its passphrase
#   APPLE_SIGNING_IDENTITY              e.g. "Developer ID Application: Name (TEAMID)"
#   APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID   notarisation (app-specific password)
# Windows is deliberately not code signed (13.4); the README explains the SmartScreen prompt.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build a draft release for, e.g. v0.1.0-test'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  draft:
    name: Draft release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.draft.outputs.id }}
    steps:
      - uses: actions/checkout@v4

      # Reuse the draft when the workflow is re-run for the same tag, so a retry does not
      # leave a second, half-filled release behind.
      - name: Create or reuse the draft
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            -q ".[] | select(.tag_name == \"$TAG\") | .id" | head -1)
          if [ -z "$id" ]; then
            id=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$TAG" -f name="clipbuf $TAG" -F draft=true \
              -f body="See the checksums and the third-party licence list attached below." \
              -q .id)
            echo "created draft release $id"
          else
            echo "reusing draft release $id"
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: draft
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 rather than the newest image: an AppImage built against a newer glibc will
          # not start on older distributions.
          - name: Linux (AppImage, deb, rpm)
            os: ubuntu-22.04
            args: '--bundles appimage,deb,rpm'
          # One universal binary rather than two downloads, so Intel Macs are covered too.
          - name: macOS (universal)
            os: macos-latest
            args: '--target universal-apple-darwin --bundles app,dmg'
            rust-targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
          # NSIS only: the MSI cannot be installed without administrator rights (13.4).
          - name: Windows (NSIS)
            os: windows-latest
            args: '--bundles nsis'

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies (Tauri + clipboard)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl wget file pkg-config \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libxdo-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Regenerated per platform: the crate graph differs between them, and the file is
      # bundled into the app as well as attached to the release (13.9).
      - name: Generate the third-party licence list
        run: npm run licenses

      # An empty APPLE_CERTIFICATE is not the same as an unset one: the bundler decides to sign
      # from the variable being there, and then fails importing a certificate that is not. A
      # missing secret expands to an empty string, so the variables are exported here instead,
      # and only the ones that actually hold something. No other runner sees them either.
      - name: Prepare the macOS signing environment
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          configured=0
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
            APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            value="${!name-}"
            if [ -n "$value" ]; then
              {
                echo "$name<<APPLE_SECRET_EOF"
                echo "$value"
                echo "APPLE_SECRET_EOF"
              } >> "$GITHUB_ENV"
              configured=$((configured + 1))
            fi
          done
          if [ "$configured" -eq 0 ]; then
            echo "::warning::No Apple signing secrets are set, so this macOS build is neither signed nor notarised (13.3)."
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # One key for every platform: the app carries a single public key, which has to
          # verify the darwin, linux and windows entries of latest.json alike.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.draft.outputs.release_id }}
          args: ${{ matrix.args }}
          includeUpdaterJson: true

      - name: Keep the licence list for the release
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: third-party
          path: THIRD-PARTY.md

  finalise:
    name: Checksums and licences
    needs: [draft, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: third-party

      # Assets of a draft release are only reachable through the API, not by tag.
      - name: Download the built assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.draft.outputs.release_id }}
        run: |
          set -euo pipefail
          mkdir -p assets
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" --paginate \
            -q '.[] | "\(.id) \(.name)"' > asset-list
          while read -r id name; do
            if [ "$name" = "SHA256SUMS.txt" ] || [ "$name" = "THIRD-PARTY.md" ]; then
              continue
            fi
            gh api "repos/$GITHUB_REPOSITORY/releases/assets/$id" \
              -H 'Accept: application/octet-stream' > "assets/$name"
          done < asset-list
          ls -l assets

      - name: Write the checksums (13.5)
        run: |
          set -euo pipefail
          cd assets
          sha256sum * > ../SHA256SUMS.txt
          cat ../SHA256SUMS.txt

      - name: Attach the checksums and the licence list
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.draft.outputs.release_id }}
        run: |
          set -euo pipefail
          # Re-running the workflow replaces these two rather than failing on a name clash.
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" --paginate \
            -q '.[] | select(.name == "SHA256SUMS.txt" or .name == "THIRD-PARTY.md") | .id' \
            | xargs -r -I{} gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/{}"
          # By release id, not by tag: a draft's tag does not exist in the repository yet.
          for file in SHA256SUMS.txt THIRD-PARTY.md; do
            gh api --method POST \
              -H 'Content-Type: text/plain' \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$file" \
              --input "$file" -q .name
          done
