[package]
name = "clipbuf"
version = "0.1.0"
description = "Clipboard buffer that visualizes and sanitizes text before pasting"
authors = ["iyasuh"]
license = "MIT"
repository = ""
edition = "2024"
rust-version = "1.85"

[lib]
name = "clipbuf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.6", features = ["tray-icon"] }
encoding_rs = "0.8"
unicode-normalization = "0.1"
clipboard-rs = { version = "0.3", default-features = false, features = ["wayland"] }
tauri-plugin-global-shortcut = "2"
env_logger = "0.11"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSPasteboard"] }

[dev-dependencies]
tempfile = "3"
